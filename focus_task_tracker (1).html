<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple, responsive task tracker built with HTML, CSS, and JavaScript.">
  <title>Focus Task — Task Tracker</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #69758b;
      --line: #e3e9f2;
      --primary: #315fe8;
      --primary-soft: #eaf0ff;
      --green: #16845d;
      --danger: #b93838;
      --radius: 18px;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top right, #e5edff 0, transparent 34%), var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .shell { width: min(900px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 40px; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; letter-spacing: -.03em; }
    .logo { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 13px; color: white; background: var(--primary); font-weight: 900; }
    .tag { color: var(--primary); background: var(--primary-soft); border-radius: 99px; padding: 8px 12px; font-size: 12px; font-weight: 800; }
    .intro { margin-bottom: 24px; }
    .intro h1 { margin: 0 0 9px; font-size: clamp(30px, 5vw, 44px); letter-spacing: -.05em; line-height: 1.08; }
    .intro p { margin: 0; color: var(--muted); line-height: 1.65; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 16px 44px rgba(27, 50, 90, .07); }
    .composer { display: flex; gap: 10px; padding: 16px; margin-bottom: 18px; }
    .composer input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 13px 14px; outline: none; }
    input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(49, 95, 232, .12); }
    .btn { border: 0; border-radius: 12px; padding: 12px 16px; background: var(--primary); color: white; font-weight: 750; }
    .btn:hover { filter: brightness(.96); }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .filters { display: flex; gap: 7px; flex-wrap: wrap; }
    .filter { border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: 9px; padding: 8px 11px; font-size: 13px; font-weight: 700; }
    .filter[aria-pressed="true"] { color: var(--primary); background: var(--primary-soft); }
    .count { color: var(--muted); font-size: 13px; white-space: nowrap; }
    .list { padding: 8px 16px 16px; }
    .task { display: flex; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--line); }
    .task:last-child { border-bottom: 0; }
    .check { appearance: none; flex: 0 0 20px; width: 20px; height: 20px; border: 1.8px solid #b9c4d5; border-radius: 7px; cursor: pointer; position: relative; }
    .check:checked { background: var(--green); border-color: var(--green); }
    .check:checked::after { content: "✓"; position: absolute; color: white; font-size: 13px; font-weight: 900; left: 3px; top: -1px; }
    .task-text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .task.done .task-text { color: #8a95a7; text-decoration: line-through; }
    .task-date { display: block; margin-top: 4px; color: var(--muted); font-size: 11px; }
    .delete { border: 0; background: transparent; color: #9aa4b4; font-size: 20px; line-height: 1; padding: 5px 7px; border-radius: 8px; }
    .delete:hover { color: var(--danger); background: #fff0f0; }
    .empty { padding: 38px 12px; text-align: center; color: var(--muted); }
    .empty strong { display: block; color: var(--text); margin-bottom: 6px; }
    .bottom { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .clear { border: 0; background: transparent; color: var(--primary); font-weight: 750; padding: 5px; }
    .clear:hover { text-decoration: underline; }
    .footer { text-align: center; color: var(--muted); font-size: 12px; margin-top: 22px; }
    @media (max-width: 560px) {
      .shell { padding-top: 28px; }
      .composer { flex-direction: column; }
      .composer .btn { width: 100%; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .bottom { align-items: flex-start; flex-direction: column; }
      .tag { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topline">
      <div class="brand"><span class="logo">FT</span><span>Focus Task</span></div>
      <span class="tag">HTML · CSS · JavaScript</span>
    </div>
    <section class="intro">
      <h1>Make space for<br>what matters.</h1>
      <p>A simple task tracker to organize your day, one task at a time.</p>
    </section>

    <form class="composer panel" id="task-form">
      <input id="task-input" type="text" maxlength="180" placeholder="What do you need to get done?" aria-label="New task" required>
      <button class="btn" type="submit">＋ Add task</button>
    </form>

    <section class="panel" aria-label="Task list">
      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">All tasks</button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">To do</button>
          <button class="filter" type="button" data-filter="done" aria-pressed="false">Completed</button>
        </div>
        <span class="count" id="count">0 tasks left</span>
      </div>
      <div class="list" id="task-list" aria-live="polite"></div>
      <div class="bottom">
        <span id="progress">Your progress will appear here.</span>
        <button class="clear" id="clear-completed" type="button">Clear completed</button>
      </div>
    </section>
    <p class="footer">Your tasks stay saved in this browser using local storage.</p>
  </main>

  <script>
    const STORAGE_KEY = "focus-task-items-v1";
    const form = document.querySelector("#task-form");
    const input = document.querySelector("#task-input");
    const list = document.querySelector("#task-list");
    const count = document.querySelector("#count");
    const progress = document.querySelector("#progress");
    const clearButton = document.querySelector("#clear-completed");
    const filterButtons = [...document.querySelectorAll("[data-filter]")];

    let tasks = loadTasks();
    let currentFilter = "all";

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved.filter(task =>
          task && typeof task.id === "string" &&
          typeof task.text === "string" &&
          typeof task.done === "boolean"
        ) : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function addTask(text) {
      tasks.unshift({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        text: text.trim(),
        done: false,
        createdAt: new Date().toLocaleDateString(undefined, { month: "short", day: "numeric" })
      });
      saveTasks();
      render();
    }

    function toggleTask(id) {
      tasks = tasks.map(task => task.id === id ? { ...task, done: !task.done } : task);
      saveTasks();
      render();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      saveTasks();
      render();
    }

    function visibleTasks() {
      if (currentFilter === "active") return tasks.filter(task => !task.done);
      if (currentFilter === "done") return tasks.filter(task => task.done);
      return tasks;
    }

    function render() {
      const remaining = tasks.filter(task => !task.done).length;
      const completed = tasks.length - remaining;
      count.textContent = `${remaining} ${remaining === 1 ? "task" : "tasks"} left`;
      progress.textContent = tasks.length
        ? `${completed} of ${tasks.length} completed`
        : "Your progress will appear here.";

      filterButtons.forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.filter === currentFilter));
      });

      list.replaceChildren();
      const shown = visibleTasks();

      if (!shown.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        const title = document.createElement("strong");
        title.textContent = currentFilter === "done" ? "No completed tasks yet" :
          currentFilter === "active" ? "You're all caught up" : "Your list is clear";
        const message = document.createElement("span");
        message.textContent = currentFilter === "active" ? "Add a task above to get started." :
          "Add a task above and make today count.";
        empty.append(title, message);
        list.append(empty);
        return;
      }

      shown.forEach(task => {
        const row = document.createElement("div");
        row.className = `task${task.done ? " done" : ""}`;

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "check";
        checkbox.checked = task.done;
        checkbox.setAttribute("aria-label", `Mark "${task.text}" ${task.done ? "to do" : "completed"}`);
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const textWrap = document.createElement("div");
        textWrap.className = "task-text";
        const text = document.createElement("span");
        text.textContent = task.text;
        const date = document.createElement("small");
        date.className = "task-date";
        date.textContent = `Added ${task.createdAt || "today"}`;
        textWrap.append(text, date);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "delete";
        remove.textContent = "×";
        remove.setAttribute("aria-label", `Delete "${task.text}"`);
        remove.addEventListener("click", () => deleteTask(task.id));

        row.append(checkbox, textWrap, remove);
        list.append(row);
      });
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      const value = input.value.trim();
      if (!value) return;
      addTask(value);
      input.value = "";
      input.focus();
    });

    filterButtons.forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        render();
      });
    });

    clearButton.addEventListener("click", () => {
      tasks = tasks.filter(task => !task.done);
      saveTasks();
      render();
    });

    render();
  </script>
</body>
</html>
